name: messenger_app
description: "Messenger — A real-time chat app powered by Flutter & Spring Boot"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5

  # Networking
  http: ^1.4.0
  stomp_dart_client: ^2.1.0

  # Local storage
  shared_preferences: ^2.5.3

  # UI / Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
